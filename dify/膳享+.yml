    - data:
        code: "import json\nimport re\nDISCLAIMER = \"本建议仅供参考，不构成医疗诊断或治疗意见。如有健康问题请咨询专业医生。\"\
          \ndef main(llm_text: str, query: str) -> dict:\n    profile = {}\n    try:\n\
          \        req = json.loads(query)\n        profile = req.get(\"profile\"\
          , {})\n    except Exception:\n        profile = {}\n    data = None\n  \
          \  raw = (llm_text or \"\").strip()\n    if raw.startswith(\"```\"):\n \
          \       raw = re.sub(r\"^```[a-zA-Z]*\\s*\", \"\", raw)\n        raw = re.sub(r\"\
          \\s*```$\", \"\", raw).strip()\n    try:\n        data = json.loads(raw)\n\
          \    except Exception:\n        m = re.search(r\"\\{.*\\}\", raw, re.S)\n\
          \        if m:\n            try:\n                data = json.loads(m.group(0))\n\
          \            except Exception:\n                data = None\n    if not\
          \ isinstance(data, dict):\n        return {\n            \"valid\": False,\n\
          \            \"final_json\": json.dumps({\n                \"blocked\":\
          \ False,\n                \"result\": {\n                    \"title\":\
          \ \"服务暂时不可用\",\n                    \"advice\": [\"抱歉，本次生成结果解析失败，请重试。\"\
          ],\n                    \"disclaimer\": DISCLAIMER,\n                },\n\
          \            }, ensure_ascii=False),\n        }\n    blocked = bool(data.get(\"\
          blocked\", False))\n    blocked_items = list((data.get(\"risk\") or {}).get(\"\
          items\") or [])\n    if not blocked:\n        high_items = [\n         \
          \   (r.get(\"item\") or \"\").strip()\n            for r in profile.get(\"\
          healthRestrictions\", [])\n            if r.get(\"severity\") == \"high\"\
          \ and r.get(\"type\") in (\"allergy\", \"taboo\", \"drug\")\n        ]\n\
          \        result = data.get(\"result\") or {}\n        haystack = json.dumps(result,\
          \ ensure_ascii=False)\n        for item in high_items:\n            if item\
          \ and item in haystack:\n                blocked = True\n              \
          \  blocked_items.append(item)\n    if blocked:\n        final = {\n    \
          \        \"blocked\": True,\n            \"risk\": {\n                \"\
          level\": \"high\",\n                \"message\": \"检测到高危食材/成分「\" + \"、\"\
          .join(blocked_items) + \"」，与档案健康限制冲突，已拦截。\",\n                \"items\"\
          : blocked_items,\n            },\n        }\n    else:\n        final =\
          \ data\n        final[\"blocked\"] = False\n        result = final.get(\"\
          result\") or {}\n        result[\"disclaimer\"] = DISCLAIMER\n        final[\"\
          result\"] = result\n    return {\"valid\": True, \"final_json\": json.dumps(final,\
          \ ensure_ascii=False)}\n"
