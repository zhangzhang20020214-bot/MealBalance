    - data:
        code: "\nimport json\ndef main(query: str) -> dict:\n    blocked = False\n\
          \    blocked_items = []\n    profile = {}\n    text = \"\"\n    try:\n \
          \       req = json.loads(query)\n        profile = req.get(\"profile\",\
          \ {})\n        inp = req.get(\"input\", {})\n        text = (inp.get(\"\
          text\") or \"\") if isinstance(inp, dict) else \"\"\n    except Exception:\n\
          \        text = query or \"\"\n    for r in profile.get(\"healthRestrictions\"\
          , []):\n        if r.get(\"severity\") == \"high\" and r.get(\"type\") in\
          \ (\"allergy\", \"taboo\", \"drug\"):\n            item = (r.get(\"item\"\
          ) or \"\").strip()\n            if item and item in text:\n            \
          \    blocked = True\n                blocked_items.append(item)\n    blocked_json\
          \ = \"\"\n    if blocked:\n        message = \"检测到高危食材/成分「\" + \"、\".join(blocked_items)\
          \ + \"」，与档案健康限制冲突，已拦截。\"\n        blocked_json = json.dumps({\n        \
          \    \"blocked\": True,\n            \"risk\": {\"level\": \"high\", \"\
          message\": message, \"items\": blocked_items},\n        }, ensure_ascii=False)\n\
          \    return {\"blocked\": blocked, \"blocked_json\": blocked_json, \"blocked_items\"\
          : blocked_items}\n\n"
