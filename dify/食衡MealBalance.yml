        code: "import json\ndef main(query: str) -> dict:\n    blocked = False\n \
          \   blocked_items = []\n    profile = {}\n    text = \"\"\n    stage = \"\
          \"\n    req = {}\n    try:\n        req = json.loads(query)\n        if\
          \ not isinstance(req, dict):\n            req = {}\n        profile = req.get(\"\
          profile\") or {}\n        inp = req.get(\"input\") or {}\n        text =\
          \ (inp.get(\"text\") or \"\") if isinstance(inp, dict) else \"\"\n     \
          \   # 这一次要哪一件事:\"\" = 完整那一路;\"names\" = 只要菜名(见 App 的 recognizeNames)\n \
          \       stage = str(req.get(\"stage\") or \"\")\n    except Exception:\n\
          \        # 这条 except 不只是异常处理,它是**纯文本提问的兜底路径**:\n        # query 不是 JSON\
          \ 时 profile 保持为空,下面的过敏原拦截整段失效,\n        # 但请求照样成功、不报错。所以别删掉它,也别让它把异常抛出去。\n\
          \        text = query or \"\"\n    # 前置硬拦截:只扫「用户这句话」,这里是对的 ——\n    # 误拦不发生在这一步,在节点\
          \ 7,原因见那边的注释。\n    for r in (profile.get(\"healthRestrictions\") or []):\n\
          \        if not isinstance(r, dict):\n            continue\n        if r.get(\"\
          severity\") == \"high\" and r.get(\"type\") in (\"allergy\", \"taboo\",\
          \ \"drug\"):\n            item = (r.get(\"item\") or \"\").strip()\n   \
          \         if item and item in text:\n                blocked = True\n  \
          \              blocked_items.append(item)\n    blocked_json = \"\"\n   \
          \ if blocked:\n        message = \"检测到高危食材/成分「\" + \"、\".join(blocked_items)\
          \ + \"」，与档案健康限制冲突，已拦截。\"\n        blocked_json = json.dumps({\n        \
          \    \"blocked\": True,\n            \"risk\": {\"level\": \"high\", \"\
          message\": message, \"items\": blocked_items},\n        }, ensure_ascii=False)\n\
          \    # 今日摄入,原样透传给 LLM 节点。\n    # App 每次提问都带着 todayIntake(今日各餐明细 + 营养合计/目标\
          \ + 缺哪几餐),\n    # 但节点 2 只挑它认识的键 —— 不透传的话这些数字就到此为止了,LLM 读不到,\n    # 用户问「今天盐吃多了吗」时它只能反问。\n\
          \    # 暂时不想要这段的话,删掉这两行即可,不影响其它任何东西。\n    today = req.get(\"todayIntake\"\
          ) if isinstance(req, dict) else None\n    today_intake = json.dumps(today,\
          \ ensure_ascii=False) if today else \"\"\n    # 档案原样往下传。以前它只给上面的拦截逻辑用,模型那边是靠\
          \ Dify 的「记忆」\n    # 把整条 query 当用户消息塞进提示词才看到的 —— 那条通道一关就静默失效,\n    # 而且不报错。现在改成显式透传,提示词里直接引用。\n\
          \    profile_json = json.dumps(profile, ensure_ascii=False)\n    return\
          \ {\n        \"blocked\": blocked,\n        \"blocked_json\": blocked_json,\n\
          \        \"blocked_items\": blocked_items,\n        \"text\": text,\n  \
          \      \"today_intake\": today_intake,\n        \"stage\": stage,\n    \
          \    \"profile_json\": profile_json,\n    }\n"
