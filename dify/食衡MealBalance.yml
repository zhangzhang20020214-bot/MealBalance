        code: "import json\nimport re\n\ndef main(llm_text: str) -> dict:\n    # 从\
          \ LLM 的 JSON 里挑出「没有 foodId」的菜 —— 那些就是目录里没有的。\n    # 提示词要求模型挑不到时整个 foodId\
          \ 键都不输出,所以判空即可。\n    raw = (llm_text or \"\").strip()\n    if raw.startswith(\"\
          ```\"):\n        raw = re.sub(r\"^```[a-zA-Z]*\\s*\", \"\", raw)\n     \
          \   raw = re.sub(r\"\\s*```$\", \"\", raw).strip()\n\n    data = None\n\
          \    try:\n        data = json.loads(raw)\n    except Exception:\n     \
          \   m = re.search(r\"\\{.*\\}\", raw, re.S)\n        if m:\n           \
          \ try:\n                data = json.loads(m.group(0))\n            except\
          \ Exception:\n                data = None\n\n    names = []\n    if isinstance(data,\
          \ dict):\n        for d in ((data.get(\"result\") or {}).get(\"dishes\"\
          ) or []):\n            if isinstance(d, dict):\n                n = (d.get(\"\
          name\") or \"\").strip()\n                if n and not d.get(\"foodId\"\
          ):\n                    names.append(n)\n\n    if not names:\n        #\
          \ 这一餐的菜全在目录里。下游那条条件分支会**跳过**搜索,\n        # 所以正常一餐里这个 query 根本用不到。\n    \
          \    # 留着它是兜底:分支要是被误删或接错,Bocha 拿到空串会报 400,\n        # 而节点失败会中断整条工作流 —— 那比多花几秒糟得多。\n\
          \        query = \"无\"\n    else:\n        query = \" \".join(names) + \"\
          \ 每100克 热量 蛋白质 脂肪 碳水化合物 钠 糖\"\n\n    return {\"query\": query, \"names_json\"\
          : json.dumps(names, ensure_ascii=False), \"has_missing\": bool(names)}"
