          \   blocks = results if isinstance(results, list) else []\n    for b in\
          \ blocks:\n        if not isinstance(b, dict):\n            continue\n \
          \       for i, w in enumerate(b.get(\"webpage\") or [], 1):\n          \
          \  if not isinstance(w, dict):\n                continue\n            name\
          \ = (w.get(\"name\") or \"\").strip()\n            site = (w.get(\"siteName\"\
          ) or \"\").strip()\n            body = (w.get(\"summary\") or w.get(\"snippet\"\
          ) or \"\").strip()\n            if name or body:\n                lines.append(f\"\
          [{i}] {name} —— {site}\\n{body}\")\n    return {\"text\": \"\\n\\n\".join(lines)\
          \ if lines else \"(没有搜索结果)\"}\n"
