    - data:
        code: "import json\nimport re\n\nKEYS = [\"kcal\", \"protein\", \"carb\",\
          \ \"fat\", \"sodium\", \"sugar\"]\n\ndef _load(raw):\n    raw = (raw or\
          \ \"\").strip()\n    if raw.startswith(\"```\"):\n        raw = re.sub(r\"\
          ^```[a-zA-Z]*\\s*\", \"\", raw)\n        raw = re.sub(r\"\\s*```$\", \"\"\
          , raw).strip()\n    try:\n        return json.loads(raw)\n    except Exception:\n\
          \        m = re.search(r\"\\{.*\\}\", raw, re.S)\n        if m:\n      \
          \      try:\n                return json.loads(m.group(0))\n           \
          \ except Exception:\n                return None\n    return None\n\ndef\
          \ main(llm_text: str, patch_json: str) -> dict:\n    data = _load(llm_text)\n\
          \    if not isinstance(data, dict):\n        # LLM 的输出解析不了 —— 原样交回去,让下游的「代码执行\
          \ 2」去走它自己\n        # 那条「解析失败」的兜底分支。这里不要自己造一个,那会掩盖真正的问题。\n        return\
          \ {\"merged\": llm_text or \"\", \"applied\": 0}\n\n    patch = _load(patch_json)\n\
          \    if not isinstance(patch, dict):\n        patch = {}\n\n    applied\
          \ = 0\n    for d in ((data.get(\"result\") or {}).get(\"dishes\") or []):\n\
          \        if not isinstance(d, dict):\n            continue\n        # 只在「模型没挑到\
          \ foodId」的菜上补。有 foodId 的菜走库里的值,\n        # 库里的值和它是同一把尺子,不该被搜索来的数覆盖。\n  \
          \      if d.get(\"foodId\"):\n            continue\n        p = patch.get((d.get(\"\
          name\") or \"\").strip())\n        if not isinstance(p, dict):\n       \
          \     continue\n        per = p.get(\"per100g\")\n        src = (p.get(\"\
          source\") or \"\").strip()\n        # 六个键少一个就不补。半份营养进总数,比明着「按 0 计」更糟 ——\n\
          \        # 后者用户看得见,前者看不见。\n        if not isinstance(per, dict):\n     \
          \       continue\n        if any(not isinstance(per.get(k), (int, float))\
          \ for k in KEYS):\n            continue\n        if not src:\n         \
          \   continue\n        d[\"per100g\"] = {k: per[k] for k in KEYS}\n     \
          \   d[\"source\"] = src\n        applied += 1\n\n    return {\"merged\"\
          : json.dumps(data, ensure_ascii=False), \"applied\": applied}"
