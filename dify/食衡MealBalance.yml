        - id: b61b3f1a-4981-4a58-8da7-d28bda7991c7
          role: system
          text: "你要从网页搜索结果里，为给定的菜品找出「每 100 克的营养成分」。\n\n要补的菜品：【这里插入{{#1789895541850.names_json#}}\
            \ 】\n\n搜索结果：\n【这里插入{{#1789896269720.text#}}】\n\n搜索结果是 JSON。每条结果在 webpage\
            \ 数组里，字段是：\n  name      网页标题      snippet / summary   摘要\n  siteName \
            \ 网站名（薄荷健康 / fatsecret / 标药网 这类）    url  网址\n\n只输出一个 JSON，不要解释、不要代码块围栏：\n\
            \n{\"土豆炖牛肉\": {\"per100g\": {\"kcal\": 109, \"protein\": 10.98, \"carb\"\
            : 5.9, \"fat\": 4.66, \"sodium\": 270, \"sugar\": 0}, \"source\": \"fatsecret.cn\"\
            }}\n\n规矩：\n\n1. 先按 name 把结果和菜品对上。「要补的菜品」里每一道都要出现 —— 除非搜到的\n   结果确实凑不齐它的六个键，那就整道菜都不要出现，不要填一部分\n\
            \n2. 六个键一个都不能少，名字不能改：kcal / protein / carb / fat / sodium / sugar\n  \
            \ 单位：kcal 千卡 ｜ protein / carb / fat / sugar 克 ｜ sodium 毫克\n\n3. 同一个菜往往有好几条结果，数字还不一样（不同食谱，实测\
            \ 102 / 109 / 101 大卡）。\n   挑六个键最全的那一条，不要把几家的数字拼起来 —— 拼出来的数没有出处，\n   而它看起来和真的一样。source\
            \ 写你选中的那一条的 siteName。\n\n4. 口径必须是「每 100 克」。搜到「1 份 (140克) 152 大卡」这种，自己折算成每\
