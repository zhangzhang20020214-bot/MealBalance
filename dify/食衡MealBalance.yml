        code: "import json\nimport re\n\nDISCLAIMER = \"本建议仅供参考，不构成医疗诊断或治疗意见。如有健康问题请咨询专业医生。\"\
          \n\ndef main(llm_text: str, query: str) -> dict:\n    profile = {}\n   \
          \ try:\n        req = json.loads(query)\n        if isinstance(req, dict):\n\
          \            profile = req.get(\"profile\") or {}\n    except Exception:\n\
          \        profile = {}\n\n    data = None\n    raw = (llm_text or \"\").strip()\n\
          \    if raw.startswith(\"```\"):\n        raw = re.sub(r\"^```[a-zA-Z]*\\\
          s*\", \"\", raw)\n        raw = re.sub(r\"\\s*```$\", \"\", raw).strip()\n\
          \n    try:\n        data = json.loads(raw)\n    except Exception:\n    \
          \    m = re.search(r\"\\{.*\\}\", raw, re.S)\n        if m:\n          \
          \  try:\n                data = json.loads(m.group(0))\n            except\
          \ Exception:\n                data = None\n\n    if not isinstance(data,\
          \ dict):\n        return {\n            \"valid\": False,\n            \"\
          final_json\": json.dumps({\n                \"blocked\": False,\n      \
          \          \"result\": {\n                    \"title\": \"服务暂时不可用\",\n\
          \                    \"advice\": [\"抱歉，本次生成结果解析失败，请重试。\"],\n           \
          \         \"disclaimer\": DISCLAIMER,\n                },\n            },\
          \ ensure_ascii=False),\n        }\n\n    blocked = bool(data.get(\"blocked\"\
          , False))\n    blocked_items = list((data.get(\"risk\") or {}).get(\"items\"\
          ) or [])\n\n    if not blocked:\n        high_items = [\n            (r.get(\"\
          item\") or \"\").strip()\n            for r in (profile.get(\"healthRestrictions\"\
          ) or [])\n            if isinstance(r, dict)\n            and r.get(\"severity\"\
          ) == \"high\"\n            and r.get(\"type\") in (\"allergy\", \"taboo\"\
          , \"drug\")\n        ]\n        result = data.get(\"result\") or {}\n  \
          \      nutrition = result.get(\"nutrition\") or {}\n\n        # ===== 这一处就是那个\
          \ bug 的修复 =====\n        # 原来这里是:  haystack = json.dumps(result, ensure_ascii=False)\n\
          \        # 扫的是 result **全文** —— 连 advice / title / recipe /\n        # healthModification\
          \ 一起扫。于是一个花生过敏的人问「晚餐吃什么」,\n        # LLM 写下「避免花生」这条完全正确的建议,反而被判定命中并拦截:\n\
          \        # 越是需要建议的人越拿不到建议。\n        # 而且它不确定 —— 同一句话跑两次,可能一次拦一次不拦。\n   \
          \     #\n        # 现在只扫「用户真的会吃进去的东西」。\n        haystack = json.dumps({\n\
          \            \"dishes\": [\n                d.get(\"name\") for d in (result.get(\"\
          dishes\") or []) if isinstance(d, dict)\n            ],\n            \"\
          ingredients\": [\n                i.get(\"name\") if isinstance(i, dict)\
          \ else i\n                for i in (result.get(\"ingredients\") or [])\n\
          \            ],\n            \"nutrition_ingredients\": nutrition.get(\"\
          ingredients\") or [],\n            \"risk_items\": nutrition.get(\"riskItems\"\
          ) or [],\n        }, ensure_ascii=False)\n\n        for item in high_items:\n\
          \            if item and item in haystack:\n                blocked = True\n\
          \                # 去重:LLM 自己可能已经把这个成分写进 risk.items 了,\n                #\
          \ 不去重的话提示语会变成「花生、花生」\n                if item not in blocked_items:\n  \
          \                  blocked_items.append(item)\n\n    # 2026-09-23:命中高危项时**不再整单拦截**。\n\
          \    # 原来的做法是把整份结果换成 blocked(dishes 一道都不返回),App 只能渲染\n    # 一张「已拦截」的卡,用户连这盘菜认出了几样都看不到。\n\
          \    # 现在:保留结果,把命中的成分写进**那道菜**的菜名括号里 ——\n    # App 里菜名的括号注释会被剥掉再匹配食物库,而显示和忌口判断看的是原名,\n\
          \    # 所以「番茄炒蛋（含鸡蛋）」既命中 tomato-egg,又会被标成「别吃」。\n    final = data\n    final[\"\
          blocked\"] = False\n    result = final.get(\"result\") or {}\n    result[\"\
          disclaimer\"] = DISCLAIMER\n\n    if blocked and blocked_items:\n      \
          \  marked = 0\n        for d in (result.get(\"dishes\") or []):\n      \
          \      if not isinstance(d, dict):\n                continue\n         \
          \   name = (d.get(\"name\") or \"\").strip()\n            if not name or\
          \ \"（\" in name:\n                continue\n            # 只看这道菜**自己**的名字和配料\
          \ —— 扫整段会把「避免鸡蛋」这种\n            # 建议也算成命中(工作流上一版就在这儿栽过,见上面 haystack 那段)\n\
          \            own = json.dumps({\n                \"name\": name,\n     \
          \           \"ingredients\": (d.get(\"nutrition\") or {}).get(\"ingredients\"\
          ) or [],\n            }, ensure_ascii=False)\n            hit = [it for\
          \ it in blocked_items if it and it in own]\n            if hit:\n      \
          \          d[\"name\"] = name + \"（含\" + \"、\".join(hit) + \"）\"\n     \
          \           marked += 1\n\n        # 一道都没标上(命中项只在整餐级的配料表里)时,退一步:整餐提示,\n\
          \        # 但**不撒谎说拦了** —— 用户至少知道这一餐里有他不能吃的东西\n        msg = (\n        \
          \    \"检测到「\" + \"、\".join(blocked_items) + \"」，与档案健康限制冲突：\"\n         \
          \   + (\"带「含…」标记的那道菜不要吃，其余的照常。\" if marked else \"这一餐里有你不能吃的东西，请逐道核对。\"\
          )\n        )\n        final[\"risk\"] = {\"level\": \"high\", \"message\"\
          : msg, \"items\": blocked_items}\n\n    final[\"result\"] = result\n\n \
          \   return {\"valid\": True, \"final_json\": json.dumps(final, ensure_ascii=False)}\n"
