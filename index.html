<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>食衡 MealBalance</title>
    <meta name="description" content="食衡 MealBalance — 记录一餐，看到营养分析、健康分与控盐建议。" />

    <!-- ---------- PWA ---------- -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- iOS 不接受 SVG 图标,必须是 PNG -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      让「添加到主屏幕」后以独立窗口打开,而不是套一层 Safari 外壳。
      status-bar-style 用 default 而非 black-translucent:
      应用自带了一层假状态栏(StatusBar.tsx)用于桌面端展示,
      真机上那层是隐藏的,所以这里交给系统去画,配色跟着页面走。
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="食衡" />
    <meta name="theme-color" content="#F2F7F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)" />

    <!-- 真机铺满整屏,不要左右留白 -->
    <meta name="format-detection" content="telephone=no" />

    <!--
      字体:正文用 Noto Sans SC(思源黑体),数字用 Inter。
      Google Fonts 会按 unicode-range 分片下发中文字形,不会一次性拉全量字库。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
